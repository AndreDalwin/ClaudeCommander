name: Build macOS Electron App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0' # Use your project's Node version

      - name: Install dependencies
        run: npm install

      # You can remove this step if your forge config handles React build
      # - name: Build React app
      #   run: npm run build

      - name: Make Electron app
        run: npm run make

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Commander-macOS-app
          path: |
            out/make/**/*.app
