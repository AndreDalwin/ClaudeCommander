  #       retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
    
    - name: Build Electron app
      run: npm run make
      env:
        CI: true
    
    - name: Upload Linux .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: commander-linux-deb-${{ github.sha }}
        path: out/make/**/*.deb
        retention-days: 30
    
    - name: Upload Linux .rpm artifact
      uses: actions/upload-artifact@v4
      with:
        name: commander-linux-rpm-${{ github.sha }}
        path: out/make/**/*.rpm
        retention-days: 30