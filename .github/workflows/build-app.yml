name: Build Commander App

on:
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.15.0'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
      
    - name: Run linting
      run: npm run lint
    
    - name: Build Electron app
      run: npm run make
      env:
        # Add these secrets in your GitHub repository settings if you want code signing
        # APPLE_ID: ${{ secrets.APPLE_ID }}
        # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # CSC_LINK: ${{ secrets.CSC_LINK }}
        # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        CI: true
    
    - name: Upload macOS .app artifact
      uses: actions/upload-artifact@v4
      with:
        name: commander-macos-${{ github.sha }}
        path: out/commander-darwin-*/commander.app
        compression-level: 0  # Faster upload for large .app bundles
        retention-days: 30
    
    - name: Upload macOS .zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: commander-macos-zip-${{ github.sha }}
        path: out/make/zip/darwin/**/*.zip
        retention-days: 30

