  #     with:
  #       name: windows-artifacts
  #       path: |
  #         out/make/**/*.exe
  #         out/make/**/*.msi
  #       retention-days: 1

  create-release:
    needs: [build-macos, build-linux]  # Add build-windows when enabled
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for changelog
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref }}^ 2>/dev/null || echo "")
        
        # Generate changelog
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG="Initial release"
        else
          CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..${{ github.ref }} | grep -v "^- Merge")
        fi
        
        # Save to file for multi-line support
        echo "$CHANGELOG" > changelog.txt
        echo "Generated changelog from ${PREV_TAG:-beginning} to ${{ github.ref }}"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Commander ${{ github.ref_name }}
        body_path: changelog.txt
        draft: false
        prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        files: |
          artifacts/**/*.zip
          artifacts/**/*.dmg
          artifacts/**/*.deb
          artifacts/**/*.rpm
          artifacts/**/*.AppImage
          artifacts/**/*.exe
          artifacts/**/*.msi
        generate_release_notes: true